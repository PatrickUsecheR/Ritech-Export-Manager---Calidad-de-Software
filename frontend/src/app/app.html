<div class="app-frame">
  <aside class="sidebar" *ngIf="auth.authenticated()">
    <a class="brand" routerLink="/dashboard" aria-label="Ritech Export Manager">
      <span class="brand-mark">R</span>
      <span><strong>ritech</strong><small>EXPORT MANAGER</small></span>
    </a>
    <p class="nav-caption">GESTIÓN</p>
    <nav aria-label="Navegación principal">
      <a *ngFor="let item of visibleNavigation()" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">{{ item.icon }}</span>{{ item.label }}
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-chip">
        <span class="avatar">{{ auth.user()?.nombre?.charAt(0) }}</span>
        <span class="user-info"><strong>{{ auth.user()?.nombre }}</strong><small>{{ auth.user()?.rol }}</small></span>
      </div>
      <button class="logout-button" (click)="logout()">Cerrar sesión <span>↗</span></button>
    </div>
  </aside>

  <main class="main-area" [class.auth-layout]="!auth.authenticated()">
    <header class="topbar" *ngIf="auth.authenticated()">
      <span class="breadcrumb">Ritech <span>/</span> Operaciones</span>
      <div class="topbar-meta"><span class="connection-dot"></span> Plataforma conectada <span class="topbar-date">{{ today | date:'EEEE, d MMMM' }}</span></div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
